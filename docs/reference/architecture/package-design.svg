<text x="176" y="641" font-size="14" text-anchor="start" fill="#444" font-style="italic">Student 3: the only place with SQL and JDBC</text>
<rect x="560" y="668" width="300" height="56" fill="#eef2fa" stroke="#333" stroke-width="2"/>
<text x="710.0" y="692" text-anchor="middle" font-size="14">«interface»</text>
<text x="710.0" y="714" text-anchor="middle" font-size="18" font-weight="bold">Database&lt;T&gt;</text>
