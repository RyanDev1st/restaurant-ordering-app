<rect x="424" y="215" width="170" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="509.0" y="239" text-anchor="middle" font-size="18" font-weight="bold">MenuFrame</text>
<rect x="606" y="215" width="170" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="691.0" y="239" text-anchor="middle" font-size="18" font-weight="bold">CartDialog</text>
<rect x="788" y="215" width="170" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="873.0" y="239" text-anchor="middle" font-size="18" font-weight="bold">OrderStatusFrame</text>
<rect x="970" y="215" width="170" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1055.0" y="239" text-anchor="middle" font-size="18" font-weight="bold">StaffOrdersFrame</text>
<rect x="1152" y="215" width="170" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1237.0" y="239" text-anchor="middle" font-size="18" font-weight="bold">AdminMenuFrame</text>
