<text x="116" y="181" font-size="14" text-anchor="start" fill="#444" font-style="italic">Student 1: the windows</text>
<rect x="60" y="215" width="170" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="145.0" y="239" text-anchor="middle" font-size="18" font-weight="bold">LoginFrame</text>
<rect x="242" y="215" width="170" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
