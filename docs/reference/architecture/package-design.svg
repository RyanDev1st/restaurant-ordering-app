<text x="210" y="108" font-size="14" text-anchor="start" fill="#333">opens LoginFrame</text>
<rect x="40" y="190" width="1500" height="160" fill="#f6f8fc" stroke="#556" stroke-width="2"/>
<rect x="40" y="160" width="60" height="30" fill="#dfe6f3" stroke="#556" stroke-width="2"/>
