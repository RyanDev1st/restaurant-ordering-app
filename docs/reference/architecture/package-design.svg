<text x="1419.0" y="239" text-anchor="middle" font-size="18" font-weight="bold">AdminStaffFrame</text>
<text x="60" y="290" font-size="15" text-anchor="start" fill="#111">Each window extends JFrame or JDialog (Swing). It keeps a private reference to the services it needs.</text>
<text x="60" y="314" font-size="15" text-anchor="start" fill="#111">It never writes SQL. When a service throws an exception, it shows the message in a pop-up.</text>
<rect x="40" y="420" width="1500" height="160" fill="#f6f8fc" stroke="#556" stroke-width="2"/>
<rect x="40" y="390" width="110" height="30" fill="#dfe6f3" stroke="#556" stroke-width="2"/>
<text x="54" y="411" font-size="16" text-anchor="start" fill="#111" font-weight="bold">service</text>
<text x="166" y="411" font-size="14" text-anchor="start" fill="#444" font-style="italic">Student 2: the rules</text>
<rect x="60" y="445" width="200" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="160.0" y="469" text-anchor="middle" font-size="18" font-weight="bold">AuthService</text>
<rect x="276" y="445" width="200" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="376.0" y="469" text-anchor="middle" font-size="18" font-weight="bold">MenuService</text>
<rect x="492" y="445" width="200" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="592.0" y="469" text-anchor="middle" font-size="18" font-weight="bold">OrderService</text>
<rect x="708" y="445" width="200" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="808.0" y="469" text-anchor="middle" font-size="18" font-weight="bold">ReceiptWriter</text>
<rect x="940" y="445" width="260" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1070.0" y="469" text-anchor="middle" font-size="18" font-weight="bold">ValidationException</text>
<rect x="1216" y="445" width="260" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1346.0" y="469" text-anchor="middle" font-size="18" font-weight="bold">AuthException</text>
<text x="60" y="520" font-size="15" text-anchor="start" fill="#111">Services check every rule and throw an exception when one fails.</text>
<text x="60" y="544" font-size="15" text-anchor="start" fill="#111">The two exception classes extend Exception, so the compiler makes the windows handle them.</text>
<rect x="40" y="650" width="1500" height="270" fill="#f6f8fc" stroke="#556" stroke-width="2"/>
<rect x="40" y="620" width="120" height="30" fill="#dfe6f3" stroke="#556" stroke-width="2"/>
