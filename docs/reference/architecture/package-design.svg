<text x="54" y="41" font-size="16" text-anchor="start" fill="#111" font-weight="bold">app</text>
<text x="126" y="41" font-size="14" text-anchor="start" fill="#444" font-style="italic">starts everything</text>
<rect x="70" y="66" width="120" height="34" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="130.0" y="90" text-anchor="middle" font-size="18" font-weight="bold">Main</text>
