<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="460" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12" fill="none" stroke="#333" stroke-width="2"/>
    </marker>
  </defs>
  <g stroke="#333" stroke-width="2">
    <rect x="30" y="60" width="240" height="190" rx="10" fill="#e8f1fd"/>
    <rect x="330" y="60" width="240" height="190" rx="10" fill="#e9f7ee"/>
    <rect x="630" y="60" width="240" height="190" rx="10" fill="#fdf3e3"/>
    <rect x="930" y="100" width="240" height="110" rx="10" fill="#f1ecfb"/>
    <rect x="30" y="330" width="840" height="100" rx="10" fill="#f4f4f4"/>
  </g>
  <g stroke="#333" stroke-width="2.5" marker-end="url(#a)">
    <line x1="270" y1="155" x2="326" y2="155"/>
    <line x1="570" y1="155" x2="626" y2="155"/>
    <line x1="870" y1="155" x2="926" y2="155"/>
  </g>
  <g stroke="#777" stroke-width="2" stroke-dasharray="7 5">
    <line x1="150" y1="250" x2="150" y2="330"/>
    <line x1="450" y1="250" x2="450" y2="330"/>
    <line x1="750" y1="250" x2="750" y2="330"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="150" y="40" font-size="20" font-weight="bold">1. Screens</text>
    <text x="450" y="40" font-size="20" font-weight="bold">2. Logic</text>
    <text x="750" y="40" font-size="20" font-weight="bold">3. Database access</text>
    <text x="1050" y="80" font-size="20" font-weight="bold">Saved data</text>
    <text x="150" y="100" font-size="18" font-weight="bold">package ui</text>
    <text x="150" y="140" font-size="16">LoginFrame, MenuFrame,</text>
    <text x="150" y="164" font-size="16">CartDialog, ... (8 windows)</text>
    <text x="150" y="210" font-size="15" font-style="italic">shows things, reacts to clicks</text>
    <text x="450" y="100" font-size="18" font-weight="bold">package service</text>
    <text x="450" y="140" font-size="16">AuthService, MenuService,</text>
    <text x="450" y="164" font-size="16">OrderService, ReceiptWriter</text>
    <text x="450" y="210" font-size="15" font-style="italic">checks the rules</text>
    <text x="750" y="100" font-size="18" font-weight="bold">package database</text>
    <text x="750" y="140" font-size="16">UserDatabase,</text>
    <text x="750" y="164" font-size="16">MenuItemDatabase, ...</text>
    <text x="750" y="210" font-size="15" font-style="italic">the only place with SQL</text>
    <text x="1050" y="150" font-size="18" font-weight="bold">restaurant.db</text>
    <text x="1050" y="178" font-size="15" font-style="italic">one SQLite file</text>
    <text x="300" y="132" font-size="14">calls</text>
    <text x="600" y="132" font-size="14">calls</text>
    <text x="900" y="132" font-size="14">SQL</text>
    <text x="450" y="370" font-size="18" font-weight="bold">package model: User, Customer, Staff, Admin, MenuItem, Order, OrderItem, ...</text>
    <text x="450" y="402" font-size="15" font-style="italic">the data objects; every layer uses them</text>
  </g>
</svg>
