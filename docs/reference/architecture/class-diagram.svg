<path d="M595.4,956.1 L608,950 L595.4,943.9" fill="none" stroke="#333" stroke-width="2"/>
<text x="624" y="955" font-size="15" text-anchor="start" fill="#111">uses</text>
<text x="540" y="992" font-size="15" text-anchor="start" fill="#111">-  private</text>
<text x="660" y="992" font-size="15" text-anchor="start" fill="#111">+  public</text>
<text x="780" y="992" font-size="15" text-anchor="start" fill="#111">#  protected</text>
<text x="540" y="1020" font-size="15" text-anchor="start" fill="#111">Italic = abstract (no body here; children write it).</text>
<text x="540" y="1046" font-size="15" text-anchor="start" fill="#111">1, *, 1..* = how many objects on that side.</text>
<text x="540" y="1072" font-size="15" text-anchor="start" fill="#111">Getters and setters are not drawn (see Table 5).</text>
